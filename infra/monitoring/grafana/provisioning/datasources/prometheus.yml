apiVersion: 1
prune: true
datasources:
  - name: Waybill Prometheus
    uid: waybill-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 5s
