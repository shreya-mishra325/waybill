global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: waybill-api
    static_configs:
      - targets: [host.docker.internal:9100]
  - job_name: waybill-publisher
    static_configs:
      - targets: [host.docker.internal:9101]
  - job_name: waybill-worker
    static_configs:
      - targets: [host.docker.internal:9102]
